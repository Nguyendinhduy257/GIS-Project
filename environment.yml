# Môi trường cho dự án "Chọn vị trí trạm sạc xe điện bằng GIS - 31 khu vực Hà Nội"
#
# Cách dùng:
#   1. Anaconda Navigator > Environments > Import > chọn file này
#   2. Hoặc dòng lệnh:  conda env create -f environment.yml
#
# Tên môi trường lấy theo trường "name" bên dưới: evgis
# Phiên bản được ghim theo môi trường đã chạy ra kết quả trong bao_cao/bao_cao.md.

name: evgis

channels:
  - conda-forge

dependencies:
  - python=3.11

  # Lõi GIS
  - geopandas=1.2.0
  - osmnx=2.1.1
  - shapely=2.2.0
  - pyproj=3.7.2
  # rasterio 1.3.10 (bản cài bằng pip trên máy tác giả) không cài được cùng
  # numpy 2.x từ conda-forge; bản 1.4.4 cho kết quả tương đương với notebook này.
  - rasterio=1.4.4
  - rasterstats=0.21.0

  # Tính toán và trực quan
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - matplotlib=3.11.2
  - mapclassify=2.10.0
  - folium=0.20.0

  # Jupyter
  - ipykernel=7.4.0
  - jupyterlab=4.6.4
  - notebook=7.6.3

  # Khác
  - requests=2.34.2
